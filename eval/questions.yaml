# ResearchLedger public evaluation set v0.1 (demo corpus: Marin; approved by the researcher, 17 Oct 2026)
#
# Written BEFORE any ingestion or agent code exists. Thresholds are in eval/THRESHOLDS.md. Every change to this file,
# before and after approval, is logged in eval/CHANGELOG.md with the reason.
#
# Corpus: marin-community/marin (Apache-2.0, read from its LICENSE file), pinned at commit 5e12684. Text only: the
# Markdown under docs/reports/ and docs/experiments/. Images and data files (e.g. .png, .jsonl) are never ingested.
# Gold citations give file and line range at that commit. An answer's citation counts as correct if it overlaps a
# gold range. No item asks about a person.
#
# Types:  lookup | why | superseded (must give the current value AND what it replaced) | claim (verdict: supported /
#         partly / unsupported) | table (answered by SQL over a table parsed from the documents) | safety (refuse or abstain)
# must_include: facts the answer must contain (numbers matched exactly, phrases by meaning)
# must_not: statements that make the answer wrong
#
# Required counts for this set (41 items; 38 non-safety), from eval/THRESHOLDS.md:
#   answer accuracy >= 31 of 38 overall; per type: lookup 9/12, why 6/8, superseded 6/8, claim 5/7; table (3) no
#   per-type gate. Superseded handling >= 6 of 8. Claim verdicts >= 6 of 7. Safety 3 of 3.

corpus: {repo: marin-community/marin, commit: 5e12684}
files:
  E8: docs/reports/marin-8b-retro.md
  E32: docs/reports/marin-32b-retro.md
  HM: docs/reports/hero-mixture-log.md
  GA: docs/reports/grug-archive.md
  DF: docs/experiments/daily-ferry-log.md
  IX: docs/reports/index.md

items:
# ---------------------------------------------------------------- lookup
- id: L01
  type: lookup
  q: What architecture settings did Marin 8B use?
  must_include: ["the same settings as Llama 3.1 8B", "hidden_dim 4096", "32 layers", "8 KV heads"]
  gold: [{f: E8, lines: [62, 71]}]
- id: L02
  type: lookup
  q: Which tokenizer does Marin use, and why?
  must_include: ["Llama 3 tokenizer", "outperformed Llama 2 and NeoX in bits-per-byte"]
  gold: [{f: E8, lines: [83, 83]}, {f: IX, lines: [68, 68]}]
- id: L03
  type: lookup
  q: What was the data mix in the first phase (Kestrel) of the 8B run?
  must_include: ["DCLM Baseline 92.6%", "StarCoder Data 6.1%", "Proofpile 2 1.3%"]
  gold: [{f: E8, lines: [151, 160]}]
- id: L04
  type: lookup
  q: What peak learning rate and weight decay did the 8B Kestrel phase use?
  must_include: ["1e-3", "roughly 3x Olmo 2 7B's 3e-4", "weight decay 0.05"]
  gold: [{f: E8, lines: [189, 192]}]
- id: L05
  type: lookup
  q: What did the 8B model score on MMLU 5-shot and GSM8K after the first cooldown (Jellyfish)?
  must_include: ["MMLU 5-shot 65.3", "GSM8K 50.9"]
  gold: [{f: E8, lines: [347, 356]}]
- id: L06
  type: lookup
  q: What hardware did the 32B run use?
  must_include: ["4 preemptible TPU v5p-512 slices", "3 slices at 18,500 steps", "reserved v4-2048 from 21,010 steps"]
  gold: [{f: E32, lines: [69, 71]}]
- id: L07
  type: lookup
  q: How many tokens went into the final Marin 32B artifact?
  must_include: ["6.437T", "2.679T + 2.684T + 1.074T", "excludes diagnostic restarts and the abandoned Bison cooldown"]
  gold: [{f: E32, lines: [59, 63]}]
- id: L08
  type: lookup
  q: What optimizer and learning-rate schedule did the 32B baseline use?
  must_include: ["AdamW", "peak LR 7e-4", "warmup 1% of steps", "decay 40% of steps"]
  gold: [{f: E32, lines: [109, 117]}]
- id: L09
  type: lookup
  q: How does Marin 32B (Mantis) compare with OLMo 2 32B Base on average accuracy?
  must_include: ["65.2 vs 63.2", "+2.0", "better on 14 of 19 tasks"]
  gold: [{f: E32, lines: [445, 449]}, {f: E32, lines: [471, 471]}]
- id: L10
  type: lookup
  q: What Paloma c4_en bits-per-byte did the first daily ferry run reach, and when did it run?
  must_include: ["1.12509", "2026-02-20 (completed 2026-02-21)", "125M"]
  gold: [{f: DF, lines: [16, 24]}]
- id: L11
  type: lookup
  q: Which data store does the hero mixture log use, and how is it organised?
  must_include: ["store_4d2e363d", "40 topic clusters", "five quality buckets"]
  gold: [{f: HM, lines: [3, 5]}]
- id: L12
  type: lookup
  q: What z-loss penalty was added in the Spoonbill cooldown?
  must_include: ["1e-4 on the final logits"]
  gold: [{f: E8, lines: [459, 459]}]

# ---------------------------------------------------------------- why / decisions
- id: W01
  type: why
  q: Why was Marin 8B built at roughly 7-8 billion parameters?
  must_include: ["reserved capacity only allowed a model of that size to be trained long enough"]
  gold: [{f: E8, lines: [54, 55]}]
- id: W02
  type: why
  q: Why was the WSD-S decay cycle changed at step 200k?
  must_include: ["no significant improvement in eval losses", "hypothesis that longer cooldowns would show more progress", "decay every 20k steps for 2k steps instead of every 10k for 1k"]
  gold: [{f: E8, lines: [178, 180]}, {f: E8, lines: [209, 212]}]
- id: W03
  type: why
  q: Why did some Paloma eval losses rise after the switch to longer decay phases?
  must_include: ["some Paloma domains' texts end with a space character that was not stripped", "the training data was not formatted that way"]
  gold: [{f: E8, lines: [224, 228]}]
- id: W04
  type: why
  q: Why was FLAN mixed into the microannealing runs?
  must_include: ["high-quality data lacks few-shot-inducing data such as multiple-choice questions", "70% PT / 15% FLAN / 15% HQ gave the best results"]
  gold: [{f: E8, lines: [283, 290]}, {f: E8, lines: [297, 299]}]
- id: W05
  type: why
  q: Why did the 32B run switch to the Qwen3 backbone?
  must_include: ["at 80k steps spikes were unavoidable even with update clipping", "QK-Norm", "warm-started from the 80k Llama weights"]
  gold: [{f: E32, lines: [208, 208]}, {f: E32, lines: [247, 247]}]
- id: W06
  type: why
  q: Why did the 32B model do so badly on GSM8k after the Bison cooldown?
  must_include: ["contamination: the Dolmino math bundle included GSM8k test items in test.json, already cached on the cluster", "OLMes formatting made the LM Eval prompts' tags more surprising", "about 22 points worse than the weakest baseline"]
  gold: [{f: E32, lines: [337, 348]}]
- id: W07
  type: why
  q: Why did the training loss phase-shift near step 190k in the Bison cooldown?
  must_include: ["the co-prime step-size (linear) shuffle produced batches from correlated data", "eval losses were unaffected, so the data shifted rather than the model becoming unstable"]
  gold: [{f: E32, lines: [355, 363]}]
- id: W08
  type: why
  q: Why didn't the 32B run use QK-Norm from the start?
  must_include: ["the 8B run had been stable without QK-Norm", "an earlier 70B trial was also stable without it"]
  gold: [{f: E32, lines: [250, 250]}]

# ---------------------------------------------------------------- superseded (current value + history)
- id: S01
  type: superseded
  q: What batch size did the 8B run train with?
  must_include: ["16Mi tokens in the final Starling cooldown", "12Mi from about 2.77e12 tokens (Ocelot)", "4Mi at the start (Kestrel)"]
  gold: [{f: E8, lines: [87, 87]}, {f: E8, lines: [242, 242]}, {f: E8, lines: [478, 478]}]
- id: S02
  type: superseded
  q: What data shuffle does Marin use?
  must_include: ["a Feistel-network permutation since the Mantis cooldown", "replaced the affine/LCG permutation p(x) = (a * x + b) % N"]
  gold: [{f: E32, lines: [422, 426]}, {f: E32, lines: [378, 378]}]
- id: S03
  type: superseded
  q: Which backbone is Marin 32B?
  must_include: ["Qwen3 32B with QK-Norm from step 80,000", "replaced the Llama 32B backbone used for steps 0-80,000"]
  gold: [{f: E32, lines: [43, 45]}, {f: E32, lines: [247, 247]}]
- id: S04
  type: superseded
  q: What max grad norm did the 32B run clip to?
  must_include: ["0.2 from 56.4K steps", "initially 1.0"]
  gold: [{f: E32, lines: [119, 119]}, {f: E32, lines: [187, 189]}]
- id: S05
  type: superseded
  q: Which cooldown produced the final Marin 32B?
  must_include: ["Mantis", "the earlier Bison cooldown was abandoned after its GSM8k contamination and shuffle phase shift"]
  gold: [{f: E32, lines: [46, 46]}, {f: E32, lines: [63, 63]}, {f: E32, lines: [376, 379]}]
- id: S06
  type: superseded
  q: Has phase 2 of the hero mixture been deployed?
  must_include: ["no: as recorded on September 14, 2026, the initial mixture is in use", "phases 2 and 3 are planned in PR #9162"]
  gold: [{f: HM, lines: [7, 9]}]
- id: S07
  type: superseded
  q: Is the grugformer-vs-hackable-125m experiment still current?
  must_include: ["no, it is deleted", "superseded by 8d752a775, the template-first workflow centred on experiments/grug/base/"]
  gold: [{f: GA, lines: [72, 78]}]
- id: S08
  type: superseded
  q: What rotary embedding settings did Marin 8B use?
  must_include: ["Llama 3-style from the Ocelot phase", "Llama 2's settings before that, by mistake"]
  gold: [{f: E8, lines: [251, 251]}]

# ---------------------------------------------------------------- claim checks
- id: C01
  type: claim
  q: "Check: 'Marin 8B Base beats Llama 3.1 Base on every benchmark'"
  verdict: partly
  must_include: ["higher average, 66.6 vs 65.3, and better on most tasks", "lower on GPQA (30.3 vs 32.3)"]
  gold: [{f: E8, lines: [588, 591]}, {f: E8, lines: [596, 596]}]
- id: C02
  type: claim
  q: "Check: 'a z-loss penalty fixed the training loss creeping up during Marin 8B's deep cooldowns'"
  verdict: supported
  must_include: ["the lm_head was exploding", "z-loss penalty of 1e-4 on the final logits"]
  gold: [{f: E8, lines: [455, 461]}, {f: E8, lines: [550, 551]}]
- id: C03
  type: claim
  q: "Check: 'switching the 32B run to the Muon optimizer fixed its loss spikes'"
  verdict: unsupported
  must_include: ["the Muon run turned into gradient ascent and was abandoned"]
  gold: [{f: E32, lines: [231, 231]}]
- id: C04
  type: claim
  q: "Check: 'Marin 32B (Mantis) is the best open-weights base model in its comparison'"
  verdict: partly
  must_include: ["best mean rank, 3.05", "Qwen 2.5 32B Base has a higher mean reciprocal rank (0.54 vs 0.44)"]
  gold: [{f: E32, lines: [459, 469]}]
- id: C05
  type: claim
  q: "Check: 'in the Ocelot phase the 8B batch size was increased by 50%'"
  verdict: partly
  must_include: ["the record conflicts: the phase summary says 50%, the Ocelot section says 3x, to 12Mi tokens, from 4Mi"]
  must_not: ["the record consistently says 50%"]
  gold: [{f: E8, lines: [113, 113]}, {f: E8, lines: [187, 187]}, {f: E8, lines: [242, 242]}]
- id: C06
  type: claim
  q: "Check: 'GSM8k contamination inflated Marin 32B's GSM8K score'"
  verdict: unsupported
  must_include: ["the contamination made it worse: about 22 points below the weakest baseline"]
  gold: [{f: E32, lines: [337, 348]}]
- id: C07
  type: claim
  q: "Check: 'adding FLAN in the 8B dessert runs improved MMLU'"
  verdict: unsupported
  must_include: ["MMLU 5-shot .653 -> .651", "the math datasets improved GSM8K from 0.509 to 0.611"]
  gold: [{f: E8, lines: [380, 381]}]

