[project]
name = "researchledger"
version = "0.1.0"
description = "Evidence-checked question answering over research repositories"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
researchledger = "researchledger.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["researchledger"]

[tool.pytest.ini_options]
testpaths = ["tests"]
