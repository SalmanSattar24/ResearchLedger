[project]
name = "researchledger"
version = "0.1.0"
description = "Evidence-checked question answering over research repositories"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]
agents = ["google-adk==2.12.0"]
# BigQuery export and SQL backend. google-api-core 2.42+ needs opentelemetry-api 1.44+, which ADK 2.12's pinned
# opentelemetry-sdk 1.42.1 does not allow.
gcp = ["google-cloud-bigquery==3.38.0", "google-api-core>=2.30,<2.42"]
service = ["researchledger[agents,gcp]", "fastapi==0.141.1", "uvicorn==0.54.0", "mcp==1.24.0",
           "opentelemetry-exporter-gcp-trace==1.11.0", "httpx>=0.27"]

[project.scripts]
researchledger = "researchledger.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["researchledger"]

[tool.pytest.ini_options]
testpaths = ["tests"]
